name: DAST ZAP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Subir a API (modo dev)
        run: |
          AEGIS_ENV=dev PYTHONPATH=src nohup python -m uvicorn aegis.main:create_app --factory \
            --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && exit 0
            sleep 2
          done
          echo "API nao subiu:"; cat api.log; exit 1

      - name: Liberar escrita para o container do ZAP
        run: chmod -R a+w "$GITHUB_WORKSPACE"

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
