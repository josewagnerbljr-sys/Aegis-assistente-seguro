# Topologia em 3 zonas de rede:
#   edge    -> gateway (única porta publicada) e api
#   backend -> api, worker, redis   (internal: true = sem rota para a internet)
#   egress  -> somente o worker, para chamar provedores de IA generativa (opcional)
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 200
  tmpfs: ["/tmp:size=16m,noexec,nosuid"]
  restart: unless-stopped

services:
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine
    <<: *hardening
    ports: ["8443:8443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [edge]
    depends_on: [api]
    mem_limit: 128m

  api:
    build: .
    <<: *hardening
    environment:
      AEGIS_ENV: prod
      AEGIS_ROLE: api
      AEGIS_BUS: redis
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AEGIS_MASTER_KEY: ${AEGIS_MASTER_KEY}
      AEGIS_USERS: ${AEGIS_USERS}
      AEGIS_AUDIT_DIR: /var/lib/aegis/audit
    volumes: ["audit:/var/lib/aegis/audit"]
    networks: [edge, backend]
    depends_on: [redis]
    mem_limit: 256m
    # o gateway não monta a base de conhecimento: privilégio mínimo

  worker:
    build: .
    <<: *hardening
    command: ["python", "-m", "aegis.worker"]
    healthcheck: {disable: true}
    environment:
      AEGIS_ENV: prod
      AEGIS_ROLE: worker
      AEGIS_BUS: redis
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AEGIS_MASTER_KEY: ${AEGIS_MASTER_KEY}
      AEGIS_AUDIT_DIR: /var/lib/aegis/audit
      AEGIS_LLM_CHAIN: ${AEGIS_LLM_CHAIN:-}
      AEGIS_ANTHROPIC_API_KEY: ${AEGIS_ANTHROPIC_API_KEY:-}
      AEGIS_OPENAI_API_KEY: ${AEGIS_OPENAI_API_KEY:-}
      AEGIS_OPENAI_BASE_URL: ${AEGIS_OPENAI_BASE_URL:-}
    volumes: ["audit:/var/lib/aegis/audit"]
    networks: [backend, egress]   # remova 'egress' se não usar LLM remoto
    depends_on: [redis]
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    <<: *hardening
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    networks: [backend]
    mem_limit: 192m

networks:
  edge: {}
  backend: {internal: true}
  egress: {}

volumes:
  audit: {}
