# Gateway de borda (camada 1): TLS, limites, cabeçalhos e proxy reverso. Sem root (porta 8443).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;

  limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_conn conn 20;
    limit_req  zone=perip burst=20 nodelay;
    limit_req_status 429;

    # apenas métodos usados pela API; documentação interativa não é exposta
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }

    location = /v1/auth/token {
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://api:8000;
    }
    location /v1/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 35s;
    }
    location /ui/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = / { return 302 /ui/; }
    location / { return 404; }
  }
}
