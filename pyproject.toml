[project]
name = "aegis-assistente-seguro"
version = "1.0.0"
description = "Assistente virtual de segurança da informação com barramento seguro, RAG e IA generativa"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S105", "S106", "SIM105", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"eval/*" = ["S"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
